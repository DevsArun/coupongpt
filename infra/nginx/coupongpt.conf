# =====================================================================
# CouponGPT — production reverse proxy (Nginx) sample.
# Terminates TLS and forwards to the PHP frontend and FastAPI backend.
# Pair with TRUST_PROXY_HEADERS=true on the backend so X-Forwarded-For is honoured.
#
# Get certs via certbot:
#   certbot --nginx -d coupongpt.example.com -d api.coupongpt.example.com
# =====================================================================

# ---- Frontend (PHP) ----
server {
    listen 80;
    server_name coupongpt.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name coupongpt.example.com;

    ssl_certificate     /etc/letsencrypt/live/coupongpt.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coupongpt.example.com/privkey.pem;

    # Security headers (defence in depth; app sets its own too)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- Backend (FastAPI) ----
server {
    listen 443 ssl http2;
    server_name api.coupongpt.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.coupongpt.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.coupongpt.example.com/privkey.pem;

    # Webhooks can carry larger payloads
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
